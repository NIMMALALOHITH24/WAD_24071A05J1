<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Wings -->
  <path d="M 170 80 Q 150 60 130 80 Q 140 70 170 85 Q 200 70 230 80 Q 210 60 190 80" fill="#C74436" />
  <path d="M 180 75 Q 160 55 140 75 Q 150 65 180 80 Q 210 65 240 75 Q 220 55 200 75" fill="#C74436" />
  
  <!-- Truck Body -->
  <g>
    <!-- Back cargo box -->
    <rect x="140" y="120" width="120" height="80" fill="#FFFFFF" stroke="#1F3A70" stroke-width="3"/>
    <rect x="150" y="130" width="35" height="30" fill="#C74436" stroke="#1F3A70" stroke-width="2"/>
    <path d="M 153 130 L 183 160 M 156 130 L 186 160" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Truck cabin -->
    <rect x="250" y="140" width="70" height="60" fill="#1F3A70" stroke="#1F3A70" stroke-width="2"/>
    <circle cx="275" cy="155" r="12" fill="#87CEEB"/>
    
    <!-- Wheels -->
    <circle cx="175" cy="210" r="20" fill="#333333" stroke="#1F3A70" stroke-width="2"/>
    <circle cx="310" cy="210" r="20" fill="#333333" stroke="#1F3A70" stroke-width="2"/>
    
    <!-- Wheel rims -->
    <circle cx="175" cy="210" r="12" fill="#666666"/>
    <circle cx="310" cy="210" r="12" fill="#666666"/>
  </g>
  
  <!-- Motion lines -->
  <line x1="80" y1="160" x2="120" y2="160" stroke="#999999" stroke-width="2"/>
  <line x1="90" y1="175" x2="125" y2="175" stroke="#999999" stroke-width="2"/>
  
  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#1F3A70">COURIER</text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="28" font-style="italic" text-anchor="middle" fill="#C74436">SERVICE</text>
  
  <!-- Stars -->
  <polygon points="180,295 183,303 191,303 185,308 188,316 180,311 172,316 175,308 169,303 177,303" fill="#C74436"/>
  <polygon points="200,295 203,303 211,303 205,308 208,316 200,311 192,316 195,308 189,303 197,303" fill="#C74436"/>
  <polygon points="220,295 223,303 231,303 225,308 228,316 220,311 212,316 215,308 209,303 217,303" fill="#C74436"/>
</svg>